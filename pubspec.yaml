name: tobacco_barn_calculator
description: "Kutsaga Tobacco Barn Calculator — offline capacity and engineering tool."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pdf: ^3.11.3
  printing: ^5.13.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/barns/

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
flutter_launcher_icons:
  android: true
  ios: false # this project is Android-only, per the Part 1 setup decision
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#225800" # real Kutsaga green — see Part 5's colour notes
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  min_sdk_android: 21